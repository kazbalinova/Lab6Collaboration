<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қатысушының жұмысы</title>

    <style>
        body {
            margin: 0;
            padding: 60px 20px;
            font-family: Arial, sans-serif;
            background: #f3eefb;
            color: #34254d;
            text-align: center;
        }

        .card {
            max-width: 650px;
            margin: auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px #34254d20;
        }

        h1 {
            color: #7652a8;
        }

        p {
            line-height: 1.7;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #7652a8;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Қатысушының жұмысы</h1>

        <h2>Командалық веб-жоба</h2>

        <p>
            Менің атым — Рахметхан.
            Мен командалық жобаға өз үлесімді қосып жатырмын.
        </p>

        <p>
            Бұл жұмыста HTML, CSS және GitHub
            технологияларын қолдандым.
        </p>

        <button onclick="alert('Менің жұмысым дайын!')">
            Тексеру
        </button>
    </div>
</body>
</html>
