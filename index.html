<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Branch Workflow</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3eefb;
            color: #34254d;
            text-align: center;
            padding: 80px 20px;
        }

        .card {
            max-width: 600px;
            margin: auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px #34254d20;
        }

        h1 {
            color: #7652a8;
        }

        p {
            line-height: 1.7;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #7652a8;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Git Branch Workflow</h1>
        <p>Бұл жоба Git жүйесіндегі тармақтармен жұмыс істеуді үйренуге арналған.</p>
        <p>Қазіргі тармақ: feature/website-description</p>
        <button onclick="alert('Feature успешно работает!')">
            Тексеру
        </button>
    </div>
</body>
</html>
